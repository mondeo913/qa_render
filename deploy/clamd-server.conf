Foreground yes
User clamav
DatabaseDirectory /var/lib/clamav
LocalSocket /tmp/clamd.sock
FixStaleSocket yes
PidFile /tmp/clamd.pid
LogTime yes
TCPSocket 3310
TCPAddr 0.0.0.0
MaxThreads 4
ReadTimeout 300
CommandReadTimeout 30
StreamMaxLength 1030M
MaxFileSize 1024M
MaxScanSize 1536M
MaxRecursion 16
AlertExceedsMax yes
ConcurrentDatabaseReload no
