name: Importar y validar SIGET QA

on:
  push:
    branches:
      - agent/cargar-siget-qa-20260804
    paths:
      - '.siget-import/**'
      - '.github/workflows/import-siget.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  importar-compilar:
    if: ${{ hashFiles('.siget-import/part_00') != '' }}
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: siget_qa
          POSTGRES_USER: siget
          POSTGRES_PASSWORD: siget_qa_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U siget -d siget_qa"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Descargar rama
        uses: actions/checkout@v4
        with:
          ref: agent/cargar-siget-qa-20260804
          fetch-depth: 0

      - name: Verificar fragmentos
        shell: bash
        run: |
          set -euo pipefail
          test -f .siget-import/part_00

      - name: Reconstruir y extraer SIGET
        shell: bash
        run: |
          set -euo pipefail
          cat .siget-import/part_* > /tmp/siget.tar.gz.b64
          base64 -d /tmp/siget.tar.gz.b64 > /tmp/siget.tar.gz
          echo "9dbbcab91febe1b2834976e52305db7806712fba198d29e0dcb2e390cdefd33f  /tmp/siget.tar.gz" | sha256sum -c -
          tar -xzf /tmp/siget.tar.gz -C .
          rm -rf .siget-import

      - name: Configurar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, xml, curl, zip, gd, intl, pdo_pgsql, pdo_sqlite
          coverage: none

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Instalar dependencias PHP
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Preparar entorno QA
        shell: bash
        run: |
          cp .env.example .env
          php artisan key:generate --force
          {
            echo 'APP_ENV=testing'
            echo 'APP_DEBUG=true'
            echo 'DB_CONNECTION=pgsql'
            echo 'DB_HOST=127.0.0.1'
            echo 'DB_PORT=5432'
            echo 'DB_DATABASE=siget_qa'
            echo 'DB_USERNAME=siget'
            echo 'DB_PASSWORD=siget_qa_password'
          } >> .env
          php artisan optimize:clear

      - name: Validar sintaxis PHP
        shell: bash
        run: |
          set -euo pipefail
          find app routes database tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Migrar base QA
        run: php artisan migrate --force

      - name: Instalar y compilar frontend
        run: |
          npm ci
          npm run build

      - name: Ejecutar pruebas
        run: php artisan test

      - name: Probar arranque HTTP
        shell: bash
        run: |
          php artisan serve --host=127.0.0.1 --port=8000 > /tmp/siget-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8000/up >/dev/null; then
              echo 'SIGET respondió correctamente en /up'
              exit 0
            fi
            sleep 2
          done
          cat /tmp/siget-server.log
          exit 1

      - name: Publicar código limpio en la rama
        shell: bash
        run: |
          set -euo pipefail
          rm -f .env
          rm -rf vendor node_modules public/build
          git config user.name 'ChatGPT GitHub Agent'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: cargar SIGET QA validado' || exit 0
          git push origin HEAD:agent/cargar-siget-qa-20260804
